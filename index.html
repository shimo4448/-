<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
</head>
<body>

<script>


class Student {

    constructor(رقم_الجلوس, الاسم, الدرجات, الحضور) {
        this.id = رقم_الجلوس;
        this.name = الاسم;
        this.grades = الدرجات;
        this.attendance = الحضور;
    }


    حساب_المتوسط() {
        let المجموع = this.grades.reduce((اجمالي, درجة) => اجمالي + درجة, 0);

        return المجموع / this.grades.length;
    }

    حساب_التقدير() {
        let المتوسط = this.حساب_المتوسط();

        if (المتوسط >= 90) {
            return "A";
        } else if (المتوسط >= 80) {
            return "B";
        } else if (المتوسط >= 70) {
            return "C";
        } else if (المتوسط >= 60) {
            return "D";
        } else if (المتوسط >= 50) {
            return "E";
        } else {
            return "F";
        }
    }


    النتيجة_النهائية() {
        if (this.حساب_المتوسط() >= 50 && this.attendance >= 75) {
            return "ناجح";
        } else {
            return "يحتاج مراجعة";
        }
    }
}


let قائمة_الطلاب = [

    new Student(201, "عمر", [95, 90, 85], 95),

    new Student(202, "نور", [42, 46, 44], 85),

    new Student(203, "يوسف", [80, 75, 85], 90),

    new Student(204, "مريم", [48, 45, 42], 80)

];


console.log("===== تقرير الطلاب =====");

قائمة_الطلاب.forEach((طالب) => {

    console.log("اسم الطالب:", طالب.name);
    console.log("المتوسط:", طالب.حساب_المتوسط());
    console.log("التقدير:", طالب.حساب_التقدير());
    console.log("النتيجة:", طالب.النتيجة_النهائية());

    console.log("----------------------");

});


let الطلاب_المتعثرون = قائمة_الطلاب.filter((طالب) => {

    let المتوسط = طالب.حساب_المتوسط();

    return المتوسط >= 40 && المتوسط <= 49;

});


let طلاب_الرأفة = الطلاب_المتعثرون.map((طالب) => {

    return {
        الاسم: طالب.name,
        المتوسط_القديم: طالب.حساب_المتوسط(),
        المتوسط_الجديد: طالب.حساب_المتوسط() + 5
    };

});



let مجموع_المتوسطات = طلاب_الرأفة.reduce((المجموع, طالب) => {

    return المجموع + طالب.المتوسط_الجديد;

}, 0);



let متوسط_الرأفة = 0;

if (طلاب_الرأفة.length > 0) {

    متوسط_الرأفة = مجموع_المتوسطات / طلاب_الرأفة.length;

}


console.log("===== لجنة الرأفة =====");

console.table(طلاب_الرأفة);

console.log("عدد الطلاب المتعثرين:", طلاب_الرأفة.length);

console.log("متوسط الطلاب بعد الرأفة:", متوسط_الرأفة);

</script>

</body>
</html>
